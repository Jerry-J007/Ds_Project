<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Confirm!</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            
            <!-- This column dictates the width of the card -->
            <div class="col-md-6 col-lg-4">
                
                <!-- card component -->
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        
                        <h2 class="text-center mb-4">Are You Sure ? </h2>
                        <h3 class="text-center mb-4 text-danger">Once Casted,Your Vote Can't Be reversed</h3>
                            <p class="text-center mb-3">Your choice: <b id="choice"></b></p>
                            <div id="confirmMsg" class="text-center mb-3"></div>
                            <button id="yesBtn" class="btn btn-primary w-100 mb-4">YES</button>
                            <a href="vote.html" class="btn btn-danger w-100">No</a>
                        <div class="text-center mt-3 ">
                            <b>Your vote is your voice</b>
                        </div>

                    </div>
                </div>
                
            </div>
        </div>
    </div>
<script>
    document.getElementById('choice').textContent =
        sessionStorage.getItem('candidate') + ' - ' + (sessionStorage.getItem('candidateName') || '');
    document.getElementById('yesBtn').addEventListener('click', async () => {
        const body = new URLSearchParams({
            roll:      sessionStorage.getItem('roll'),
            password:  sessionStorage.getItem('password'),
            candidate: sessionStorage.getItem('candidate')
        });
        const r = await fetch('/api/ballots/' + sessionStorage.getItem('ballotId') + '/vote',
                              { method: 'POST', body });
        const data = await r.json();

        document.getElementById('confirmMsg').textContent =
            data.ok ? 'Vote recorded.' : data.message;
        if (data.ok) {
            sessionStorage.clear();                         // forget the password
            document.getElementById('yesBtn').classList.add('d-none');
            const back = document.querySelector('a[href="vote.html"]');
            back.href = 'index.html';
            back.textContent = 'Back to dashboard';
        }
    });
</script>

</body>
</html>
