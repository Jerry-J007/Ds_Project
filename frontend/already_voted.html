<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Already Voted</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-5 text-center">

                        <h2 class="mb-3">Already voted</h2>
                        <p id="ballotName" class="text-muted"></p>

                        <p class="mb-1">You voted for candidate</p>
                        <h3 id="candidate" class="text-primary mb-4"></h3>

                        <a href="index.html" class="btn btn-outline-secondary w-100">Back to dashboard</a>

                        <div class="mt-3"><b>Your vote is your voice</b></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const candidate = sessionStorage.getItem('votedFor');
        if (candidate === null) {                       // opened directly, nothing to show
            window.location.href = 'index.html';
        } else {
            document.getElementById('candidate').textContent = candidate;
            document.getElementById('ballotName').textContent =
                sessionStorage.getItem('ballotTitle') || '';
        }
    </script>
</body>
</html>
