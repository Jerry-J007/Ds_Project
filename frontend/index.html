<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Voting System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Transparent Voting System (C++ Backend)</h1>
    
    <div class="card">
        <h2>Cast a Vote</h2>
        <form id="voteForm">
            <input type="number" id="rollInput" placeholder="Enter Roll No" required>
            <select id="candidateSelect">
                <option value="1">Candidate 1</option>
                <option value="2">Candidate 2</option>
                <option value="3">Candidate 3</option>
            </select>
            <button type="submit">Cast Vote</button>
        </form>
        <p id="statusMessage"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
