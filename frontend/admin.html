<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Ballot Admin</title>
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Admin: <span id="title"></span></h2>
            <div>
                <button id="endBtn" class="btn btn-danger me-2">End poll</button>
                <a href="index.html" id="logout" class="btn btn-outline-danger">Logout</a>
            </div>
        </div>

        <p id="msg" class="small"></p>

        <!-- tamper check -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Check for tampering</h5>
                <form id="tamperForm">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="mode" id="modeAll" value="all" checked>
                        <label class="form-check-label" for="modeAll">Entire chain</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="mode" id="modeInt" value="interval">
                        <label class="form-check-label" for="modeInt">Interval of B+ tree block ids</label>
                    </div>
                    <div id="intervalBox" class="row g-2 mb-3" style="max-width: 360px;">
                        <div class="col"><input type="number" min="0" id="start" class="form-control" placeholder="Start id" disabled></div>
                        <div class="col"><input type="number" min="0" id="end" class="form-control" placeholder="End id" disabled></div>
                    </div>
                    <div id="range" class="text-muted small mb-2"></div>
                    <button type="submit" class="btn btn-primary">Check</button>
                </form>
                <div id="tamperResult" class="mt-3"></div>
            </div>
        </div>

        <!-- tally -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Current tally</h5>
                <div id="tally"></div>
            </div>
        </div>

        <!-- voters -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Registered voters</h5>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Roll</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                        <tbody id="voters"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ballotId = sessionStorage.getItem('ballotId');
        const roll     = sessionStorage.getItem('roll');
        const password = sessionStorage.getItem('password');
        const msg = document.getElementById('msg');

        if (!ballotId || !roll || !password) window.location.href = 'index.html';

        document.getElementById('logout').addEventListener('click', () => sessionStorage.clear());

        async function call(action, extra) {
            const r = await fetch('/api/ballots/' + ballotId + '/admin/' + action,
                { method: 'POST', body: new URLSearchParams({ roll, password, ...extra }) });
            return r.json();
        }

        function showMsg(text, cls) {
            msg.textContent = text;
            msg.className = 'small ' + cls;
        }

        async function refresh() {
            const d = await call('info', {});
            if (!d.ok) { showMsg(d.message, 'text-danger'); return; }

            document.getElementById('title').textContent = d.title;
            document.getElementById('range').textContent = d.blocks
                ? d.blocks + ' vote(s) stored, block ids 0 to ' + d.maxBlockId
                : 'No votes cast yet.';

            const tally = document.getElementById('tally');
            tally.textContent = '';
            if (!d.tally.length) tally.textContent = 'No votes yet.';
            for (const t of d.tally) {
                const line = document.createElement('div');
                line.textContent = 'Candidate ' + t.candidate + ' - ' + t.name + ': ' + t.votes + ' vote(s)';
                tally.appendChild(line);
            }

            const body = document.getElementById('voters');
            body.textContent = '';
            for (const v of d.voters) {
                const tr = document.createElement('tr');
                const r = document.createElement('td');
                r.textContent = v.roll;

                const s = document.createElement('td');
                const badge = document.createElement('span');
                badge.className = 'badge ' + (v.voted ? 'bg-success' : 'bg-secondary');
                badge.textContent = v.voted ? 'Voted' : 'Not voted';
                s.appendChild(badge);

                const actions = document.createElement('td');
                actions.className = 'text-end';
                if (v.voted) {
                    const rv = document.createElement('button');
                    rv.className = 'btn btn-sm btn-outline-warning me-2';
                    rv.textContent = 'Remove vote';
                    rv.addEventListener('click', () => act('remove_vote', v.roll, 'Remove the vote of ' + v.roll + '? They stay registered and can vote again.'));
                    actions.appendChild(rv);
                }
                const rm = document.createElement('button');
                rm.className = 'btn btn-sm btn-outline-danger';
                rm.textContent = 'Remove voter';
                rm.addEventListener('click', () => act('remove_voter', v.roll, 'Remove ' + v.roll + ' from this ballot (and their vote)?'));
                actions.appendChild(rm);

                tr.append(r, s, actions);
                body.appendChild(tr);
            }
        }

        async function act(action, target, question) {
            if (!confirm(question)) return;
            const d = await call(action, { target });
            showMsg(d.ok ? 'Done.' : d.message, d.ok ? 'text-success' : 'text-danger');
            document.getElementById('tamperResult').textContent = '';   // old result no longer applies
            refresh();
        }

        // interval inputs only active when "interval" is selected
        document.querySelectorAll('input[name="mode"]').forEach(el => el.addEventListener('change', () => {
            const on = document.getElementById('modeInt').checked;
            document.getElementById('start').disabled = !on;
            document.getElementById('end').disabled = !on;
        }));

        document.getElementById('tamperForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const extra = { mode };
            if (mode === 'interval') {
                extra.start = document.getElementById('start').value;
                extra.end = document.getElementById('end').value;
            }
            const d = await call('tamper', extra);
            const out = document.getElementById('tamperResult');
            out.textContent = '';
            const alertBox = document.createElement('div');
            if (!d.ok) {
                alertBox.className = 'alert alert-warning mb-0';
                alertBox.textContent = d.message;
            } else if (d.tampered) {
                alertBox.className = 'alert alert-danger mb-0';
                alertBox.textContent = 'TAMPERED: the chain breaks at block id ' + d.blockId +
                    ' (voter ' + d.roll + ', ' + d.timestamp + ').';
            } else {
                alertBox.className = 'alert alert-success mb-0';
                alertBox.textContent = 'No tampering found.';
            }
            out.appendChild(alertBox);
        });

        // ending is final: the votes are discarded and only the statistics stay
        document.getElementById('endBtn').addEventListener('click', async () => {
            if (!confirm('End this poll? Nobody can vote afterwards and only the final results are kept. This cannot be undone.')) return;
            const d = await call('end', {});
            if (!d.ok) { showMsg(d.message, 'text-danger'); return; }
            const r = await fetch('/api/ballots/' + ballotId + '/access',
                { method: 'POST', body: new URLSearchParams({ roll, password }) });
            sessionStorage.setItem('results', JSON.stringify(await r.json()));
            sessionStorage.removeItem('password');
            window.location.href = 'results.html';
        });

        refresh();
    </script>
</body>
</html>
